<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#FBFBF8" />
  <meta name="description" content="Inventário Gamer — encontre o item que falta no seu inventário." />
  <title>Inventário Gamer</title>
  <link rel="icon" href="/assets/brand/mark.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <a class="skip-link" href="#app">Pular para o conteúdo</a>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#/" aria-label="Inventário Gamer — início">
        <img class="brand-logo" src="/assets/brand/inventario-logo-header.png" alt="Inventário Gamer" />
      </a>

      <div class="search-shell" data-search-shell>
        <label class="sr-only" for="global-search">Buscar games, franquias ou colecionáveis</label>
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input id="global-search" type="search" placeholder="Busque por games, franquias ou colecionáveis..." autocomplete="off" />
        <div class="search-suggestions" id="search-suggestions" role="listbox" hidden></div>
      </div>

      <nav class="main-nav" aria-label="Categorias">
        <a href="#/games">Games</a>
        <a href="#/merch?cat=acessorios">Acessórios</a>
        <a href="#/merch?cat=colecionaveis">Colecionáveis</a>
        <a href="#/merch?cat=fanmade">Fan-made</a>
        <a href="#/em-alta">Em alta</a>
      </nav>

      <a class="inventory-link" href="#/inventario">
        <span class="inventory-pixel" aria-hidden="true"></span>
        <span>Meu Inventário</span>
        <span class="inventory-badge" data-inventory-count hidden>0</span>
      </a>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="footer-inner">
      <span>Inventário Gamer organiza descoberta e comparação; a compra acontece na loja de origem.</span>
      <span>Dados visuais podem vir da IGDB. Preços só aparecem quando a fonte é confiável.</span>
    </div>
  </footer>

  <nav class="mobile-bottom" aria-label="Navegação móvel">
    <a href="#/"><b aria-hidden="true">⌂</b><span>Início</span></a>
    <button type="button" data-mobile-search><b aria-hidden="true">⌕</b><span>Busca</span></button>
    <a href="#/inventario"><b aria-hidden="true">▣</b><span>Inventário</span></a>
  </nav>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
